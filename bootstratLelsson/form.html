<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrat/css/bootstrap.min.css">
    <script src="bootstrat/js/bootstrap.min.js"></script>
</head>
<body>
    <h1 class="text-center mt-5">Bootstrap Form Example</h1>

    <div class="container mt-5">
        <form>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email">
            </div>
            <div>
                <label for="passward" class="form-label">Password</label>
                <input type="password" class="form-control" id="passward" placeholder="Enter your password">
            </div>
            <div class="form-check-inline">
                <input type="radio" class="form-check-input" name="gender" id="male">
                <label for="male" class="form-label">Male</label>
                <input type="radio" class="form-check-input" name="gender" id="female">
                <label for="female" class="form-label">Female</label>
            </div>
            <div class="my-3">
                <label for="country" class="form-label">Country</label>
                <select class="form-select" id="country">
                    <option value="">Select a country</option>
                    <option value="us">United States</option>
                    <option value="uk">United Kingdom</option>
                    <option value="ca">Canada</option>
                </select>
            </div>

            <div class="my-3">
                <label for="photo" class="form-label">Photo</label>
                <input type="file" class="form-control" id="photo">
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="subscribe">
                <label for="subscribe" class="form-label">Subscribe to newsletter</label>

            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Enter your message"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
</body>
</html>
